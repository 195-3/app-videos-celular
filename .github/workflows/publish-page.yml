name: publish-page
# Veltora Studio — publica (o republica) solo la página en GitHub Pages,
# sin generar video. Se usa al cambiar page/ o para el primer despliegue.
# También corre sola cuando cambia algo en page/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "page/**"

jobs:
  publish-page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publicar página en GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_pages.sh
