name: test-video
# Veltora Studio — fase 2.
# Genera un video desde un tema (investigación automática en el script),
# lo sube como artifact y lo publica en GitHub Pages para descargarlo
# desde el teléfono. La página (page/) también se publica aquí.
on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema del video"
        required: true
        default: "Grandmaster Chime Patek Philippe"
      modo:
        description: "Modo: tema (video desde un tema) o curar (rehacer un video viral)"
        required: false
        default: "tema"
        type: choice
        options:
          - tema
          - curar
      video_url:
        description: "Modo curar: enlace de YouTube del video viral"
        required: false
        default: ""
      variante:
        description: "Modo curar: mismo-tema (cambia cosas) u otro-tema (misma fórmula, otro tema)"
        required: false
        default: "mismo-tema"
        type: choice
        options:
          - mismo-tema
          - otro-tema
      tema_nuevo:
        description: "Modo curar + otro-tema: tema del video nuevo"
        required: false
        default: ""
      transcripcion_pegada:
          description: "Modo curar: transcripción pegada del video (opcional)"
          required: false
          default: ""
      duracion:
        description: "Duración objetivo en segundos (30, 35, 45 o 60)"
        required: false
        default: "35"
      formato:
        description: "Formato (vertical: TikTok/Reels/Shorts; horizontal: YouTube)"
        required: false
        default: "vertical"
        type: choice
        options:
          - vertical
          - horizontal
      musica:
        description: "Música de fondo CC0 (Lovely Piano Song, Kevin MacLeod)"
        required: false
        default: "si"
        type: choice
        options:
          - "si"
          - "no"

jobs:
  test-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
            actions: read
    steps:
      - name: Marcar inicio
        run: |
          echo "START_TS=$(date +%s)" >> $GITHUB_ENV
          date -u +"Inicio UTC: %Y-%m-%dT%H:%M:%SZ"

      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: FFmpeg y Chrome headless
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y -qq ./google-chrome-stable_current_amd64.deb || echo "AVISO: Chrome no se pudo instalar (no bloqueante)"
          google-chrome --version || echo "Chrome no disponible"

      - name: Dependencias Python
        run: |
          python -m pip install -q --upgrade pip
          pip install -q kokoro-onnx soundfile requests numpy youtube-transcript-api yt-dlp

      - name: Generar video
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: python scripts/make_video.py --tema "${{ inputs.tema }}" --duracion "${{ inputs.duracion }}" --formato "${{ inputs.formato }}" --musica "${{ inputs.musica }}" --modo "${{ inputs.modo }}" --video-url "${{ inputs.video_url }}" --variante "${{ inputs.variante }}" --tema-nuevo "${{ inputs.tema_nuevo }}" --transcripcion-pegada "${{ inputs.transcripcion_pegada }}"

      - name: Verificar MP4
        run: |
        
          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=codec_type,codec_name,width,height \
            -of default=noprint_wrappers=1 out/video.mp4
          cat out/report.json

      - name: Subir MP4 como artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.formato }}-${{ inputs.duracion }}s
          path: out/video.mp4
          retention-days: 30

      - name: Guardar reporte en el repo
        run: |
          python - <<'EOF'
          import json, os, time
          start = int(os.environ.get("START_TS", "0"))
          with open("out/report.json", encoding="utf-8") as f:
              rep = json.load(f)
          rep["workflow"] = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
              "tiempo_wall_s": round(time.time() - start, 1) if start else None,
          }
          with open("run-report.json", "w", encoding="utf-8") as f:
              json.dump(rep, f, indent=2, ensure_ascii=False)
          print(json.dumps(rep, indent=2, ensure_ascii=False))
          EOF
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add run-report.json
          git commit -m "run-report: test video ${{ github.run_id }}" || echo "sin cambios"
          git push

      - name: Publicar video y página en GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DUR=$(python3 -c "import json; print(json.load(open('out/report.json'))['video']['duracion_s'])")
          TEMA=$(python3 -c "import json; print(json.load(open('out/report.json'))['tema'])")
          bash scripts/publish_pages.sh out/video.mp4 "${{ github.run_id }}" "$TEMA" "${{ inputs.formato }}" "$DUR"

      - name: Marcar fin
        run: |
          date -u +"Fin UTC: %Y-%m-%dT%H:%M:%SZ"
