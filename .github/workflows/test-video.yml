name: test-video
# PRUEBA MÍNIMA. Genera un video vertical 30-45 s desde un tema y lo sube
# como artifact. No hay frontal, ni cola, ni publicación automática.
on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema del video"
        required: true
        default: "Grandmaster Chime Patek Philippe"
      duracion:
        description: "Duración objetivo en segundos"
        required: false
        default: "35"

jobs:
  test-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Marcar inicio
        run: |
          echo "START_TS=$(date +%s)" >> $GITHUB_ENV
          date -u +"Inicio UTC: %Y-%m-%dT%H:%M:%SZ"

      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: FFmpeg y Chrome headless
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y -qq ./google-chrome-stable_current_amd64.deb || echo "AVISO: Chrome no se pudo instalar (no bloqueante)"
          google-chrome --version || echo "Chrome no disponible"

      - name: Dependencias Python
        run: |
          python -m pip install -q --upgrade pip
          pip install -q kokoro-onnx soundfile requests numpy

      - name: Generar video
        run: python scripts/make_video.py --tema "${{ inputs.tema }}" --duracion "${{ inputs.duracion }}"

      - name: Verificar MP4
        run: |
          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=codec_type,codec_name,width,height \
            -of default=noprint_wrappers=1 out/video.mp4
          cat out/report.json

      - name: Subir MP4 como artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-35s
          path: out/video.mp4
          retention-days: 30

      - name: Guardar reporte en el repo
        run: |
          python - <<'EOF'
          import json, os, time
          start = int(os.environ.get("START_TS", "0"))
          with open("out/report.json", encoding="utf-8") as f:
              rep = json.load(f)
          rep["workflow"] = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
              "tiempo_wall_s": round(time.time() - start, 1) if start else None,
          }
          with open("run-report.json", "w", encoding="utf-8") as f:
              json.dump(rep, f, indent=2, ensure_ascii=False)
          print(json.dumps(rep, indent=2, ensure_ascii=False))
          EOF
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add run-report.json
          git commit -m "run-report: test video ${{ github.run_id }}" || echo "sin cambios"
          git push

      - name: Marcar fin
        run: |
          date -u +"Fin UTC: %Y-%m-%dT%H:%M:%SZ"
